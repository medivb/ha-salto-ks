set_easy_office_mode_schedule:
  target:
    entity:
      integration: saltoks
      domain: lock
  fields:
    auto_start:
      example: true
      selector:
        boolean:
    days:
      example: ["monday", "tuesday", "wednesday", "thursday", "friday"]
      selector:
        select:
          multiple: true
          translation_key: weekday
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    start_time:
      example: "08:00"
      selector:
        time:
    end_time:
      example: "17:00"
      selector:
        time:
    start_date:
      example: "2026-01-01"
      selector:
        date:
    end_date:
      example: "2026-12-31"
      selector:
        date:

remove_easy_office_mode_schedule:
  target:
    entity:
      integration: saltoks
      domain: lock
